name: Unpack source
on:
  push:
    paths: ['.github/workflows/unpack.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the uploaded source into the repo
        run: |
          unzip -o usamasheikh-redesign-v2-source.zip -d .
          rm -f usamasheikh-redesign-v2-source.zip .github/workflows/unpack.yml
      - name: Apply the latest file updates
        shell: python
        run: |
          import base64,pathlib
          F={
            'server/src/config.js': '',
            'render.yaml': '',
            'server/.env.example': '',
            'README.md': '',
          }
          for k,v in F.items(): pathlib.Path(k).write_bytes(base64.b64decode(v))
      - name: Commit
        run: |
          git config user.name "Usama Sheikh"
          git config user.email "hello@usamasheikh.com"
          git add -A
          git commit -m "Add redesign v2 source (site, API, admin, deploy workflow)"
          git push
